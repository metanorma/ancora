# The metanorma chain: everything in the metanorma org that the
# terminus (metanorma-cli) transitively needs. lutaml, relaton, pubid,
# and glossarist gems inside that closure are external chains - they
# are gated by mirroring (M5), never re-released here.
name: metanorma
inventory:
  orgs: [metanorma]
  # restrict to the cli's dependency closure, so org tooling that the
  # cli never sees (cimas, xseed, ...) stays out of the waves
  roots: [metanorma-cli]
# the terminus must be alone in the final wave of any plan that
# reaches it; promotion embeds the wave manifest in its release notes
terminus: [metanorma-cli]
# the integration gate: every wave gem's suite runs against a lock
# pinning the ENTIRE candidate set, then the canary compiles a real
# corpus document end-to-end including site rendering (the cg3 lesson:
# unit-green does not mean works)
gate:
  commands: [bundle exec rspec]
canary:
  commands:
    - bin/compile-plateau-doc.sh   # small real corpus doc -> presentation + site-gen
# no finals without explicit approval (ancora approve) - the guardrail
# until two supervised waves complete clean
promote_approval: manual
